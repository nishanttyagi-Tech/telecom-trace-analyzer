[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-trace-analyzer"
version = "0.1.0"
description = "Protocol-aware telecom PCAP and SIP trace analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nishant Tyagi"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
telecom-trace = "telecom_trace_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
